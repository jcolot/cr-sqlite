<!doctype html>
<meta charset="utf-8" />
<title>cr-sqlite multi-tab (SharedWorker owner) — wa-sqlite v1</title>
<style>
  body { font: 14px/1.5 ui-monospace, SFMono-Regular, Menlo, monospace; margin: 24px; background:#0b0e14; color:#c9d1d9; max-width: 640px; }
  h1 { font-size: 15px; color:#8b949e; font-weight:600; }
  .meta { color:#8b949e; margin-bottom: 12px; }
  #status { padding:4px 8px; border-radius:6px; display:inline-block; background:#1f2937; }
  #status.ok { color:#3fb950; } #status.fail { color:#f85149; }
  form { margin: 14px 0; display:flex; gap:8px; }
  input { flex:1; background:#161b22; border:1px solid #30363d; color:#c9d1d9; padding:6px 8px; border-radius:6px; font:inherit; }
  button { background:#238636; color:#fff; border:0; padding:6px 14px; border-radius:6px; cursor:pointer; font:inherit; }
  ul { list-style:none; padding:0; border:1px solid #30363d; border-radius:8px; min-height:40px; }
  li { padding:6px 10px; border-bottom:1px solid #21262d; }
  li:last-child { border-bottom:0; }
  #log { margin-top:16px; color:#8b949e; font-size:12px; max-height:180px; overflow:auto; }
  b { color:#c9d1d9; }
</style>
<h1>cr-sqlite × OPFS multi-tab — one SharedWorker owns the DB, tabs share it</h1>
<div class="meta">
  tab <b id="tabid">…</b> · <span id="status">connecting…</span><br />
  Open this page in <b>two tabs</b>. Add a todo in one — it appears in the other live,
  via cr-sqlite <code>onUpdate</code> fanned out from the shared owner.
</div>

<form id="add">
  <input id="text" placeholder="new todo…" autocomplete="off" />
  <button type="submit">add</button>
</form>

<ul id="list"></ul>
<div id="log"></div>

<script type="module" src="./tab.js"></script>
